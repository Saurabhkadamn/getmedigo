version: '3.9'

services:
  api-gateway:
    build: ./services/api-gateway
    container_name: api-gateway
    ports:
      - "8000:8000"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8000
      USER_SERVICE_URL: http://user-service:8000
      CONTENT_SERVICE_URL: http://content-service:8000
    depends_on:
      - auth-service
      - user-service
      - content-service

  auth-service:
    build: ./services/auth-service
    container_name: auth-service
    ports:
      - "8001:8000"

  user-service:
    build: ./services/user-service
    container_name: user-service
    ports:
      - "8002:8000"

  content-service:
    build: ./services/content-service
    container_name: content-service
    ports:
      - "8003:8000"

  postgres:
    image: postgres:16
    container_name: getmedigo-postgres
    environment:
      POSTGRES_USER: getmedigo
      POSTGRES_PASSWORD: getmedigo
      POSTGRES_DB: getmedigo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: getmedigo-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
